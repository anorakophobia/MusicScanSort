[package]
name = "musicscansort"
version = "0.2.0"
edition = "2024"
description = "Sort scanned sheet-music PDFs into per-instrument PDFs"
license = "MIT"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
eframe = "0.37"
env_logger = "0.11"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
log = "0.4"
ocrs = "0.13.1"
pdfium-bundled = { version = "0.2.0", features = ["bundled"] }
rayon = "1.10"
rfd = "0.17"
rten = "0.26"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
trash = "5.2"
walkdir = "2.5"

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
